name: Pinned source for forecast integration
on:
  push:
    branches: [ffw/forecast-integration-20261117]
    paths: [.github/workflows/forecast-integration-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Export pinned SYMFLUENCE package without executing its code
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source fetch --depth=1 https://github.com/symfluence-org/SYMFLUENCE.git df9b6447080b85ec6566dc7ad4ed901a623ad0bc
          test "$(git -C source rev-parse FETCH_HEAD)" = df9b6447080b85ec6566dc7ad4ed901a623ad0bc
          git -C source archive --format=zip --prefix=SYMFLUENCE/ FETCH_HEAD src pyproject.toml LICENSE tests > symfluence_pinned_source.zip
          sha256sum symfluence_pinned_source.zip > symfluence_pinned_source.zip.sha256
          git -C source ls-tree -r FETCH_HEAD > symfluence_tree.txt
      - name: Download optional Linux wheels for offline checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir wheels
          python -m pip download --only-binary=:all: --dest wheels ruff eccodes eccodeslib eckitlib findlibs attrs
          python -m pip download --only-binary=:all: --python-version 3.13 --platform manylinux_2_17_x86_64 --implementation cp --abi cp313 --dest wheels netCDF4 cftime numpy cffi pycparser certifi
          sha256sum wheels/* > wheels.sha256
      - name: Retain sources and dependency wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symfluence-source-and-verification-wheels
          path: |
            symfluence_pinned_source.zip
            symfluence_pinned_source.zip.sha256
            symfluence_tree.txt
            wheels
            wheels.sha256
          if-no-files-found: error
          retention-days: 3
