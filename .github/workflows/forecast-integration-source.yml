name: Pinned source for forecast integration
on:
  push:
    branches: [ffw/forecast-integration-20261117]
    paths: [.github/workflows/forecast-integration-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download remaining verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir wheels
          python -m pip download --no-deps --dest wheels h5netcdf geovoronoi multiurl ecmwf-datastores-client
          python -m pip download --only-binary=:all: --python-version 3.13 --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 --implementation cp --abi cp313 --dest wheels rtree
          sha256sum wheels/* > wheels.sha256
      - name: Retain dependency wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: netcdf-client-verification
          path: |
            wheels
            wheels.sha256
          if-no-files-found: error
          retention-days: 3
